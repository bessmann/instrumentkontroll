<!doctype html>
<html lang="{{ .Site.LanguageCode | default "sv" }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Instrumentkontroll Bessmann AB – reparation, underhållsservice och kalibrering av elektriska mätinstrument. Certifierad Honeywell Tanksystem Service Station i Göteborg."
    />
    <title>{{ .Site.Title }}</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/meta/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/meta/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/meta/favicon-16x16.png" />
    <link rel="manifest" href="/meta/site.webmanifest" />

    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/open-props.css" />
    <link rel="stylesheet" href="/css/open-props-colors-hsl.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    />
    <link rel="stylesheet" href="/css/typography.css" />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    {{ block "main" . }}{{ end }}

    <script src="/js/menu.js" defer></script>
    <script src="https://web3forms.com/client/script.js" async defer></script>
    <script
      data-goatcounter="https://bessmann.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
